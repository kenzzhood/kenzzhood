<svg xmlns="http://www.w3.org/2000/svg" width="860" height="430" viewBox="0 0 860 430" role="img" aria-labelledby="title desc" font-family="'JetBrains Mono', 'SFMono-Regular', ui-monospace, Menlo, Consolas, monospace"><title id="title">Engineering capability matrix</title><desc id="desc">Computer vision, spatial computing, and AI systems capabilities.</desc><style>:root{--bg:#080b10;--surface:#0d1219;--surface_2:#111821;--line:#263140;--line_soft:#18212c;--text:#f0f4f8;--muted:#8c9aaa;--faint:#596777;--green:#6ee7a2;--cyan:#7dd3fc;--violet:#c4b5fd;--empty:#141b24}.bg{fill:var(--bg)}.surface{fill:var(--surface)}.surface2{fill:var(--surface_2)}.line{stroke:var(--line)}.lineSoft{stroke:var(--line_soft)}.text{fill:var(--text)}.muted{fill:var(--muted)}.faint{fill:var(--faint)}.green{fill:var(--green)}.cyan{fill:var(--cyan)}.violet{fill:var(--violet)}@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}.rise{opacity:0;animation:rise .7s cubic-bezier(.2,.8,.2,1) forwards}.fade{opacity:0;animation:fade .6s ease forwards}.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.2s cubic-bezier(.2,.8,.2,1) forwards}.pulse{animation:pulse 2.4s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.rise,.fade,.draw,.pulse{animation:none!important;opacity:1!important;transform:none!important;stroke-dashoffset:0!important}}</style><rect class="bg" width="860" height="430" rx="18"/><rect x=".5" y=".5" width="859" height="429" rx="18" fill="none" class="line" stroke-width="1"/><text x="32" y="37" class="green" font-size="9.5" letter-spacing="1.8">CAPABILITY MATRIX // SYSTEMS I BUILD</text><text x="32" y="72" class="text" font-size="23" font-weight="700">From perception to interaction.</text><text x="32" y="96" class="muted" font-size="11.5">Three disciplines, designed as one connected engineering stack.</text><line x1="32" y1="116" x2="828" y2="116" class="line draw" pathLength="1" stroke-width="1" style="animation-delay:.12s"/><g class="rise" style="animation-delay:0.20s"><rect x="32" y="140" width="252" height="250" rx="14" class="surface" stroke="var(--line)" stroke-width="1"/><text x="50" y="168" class="green" font-size="9.5" letter-spacing="1.4">01 / COMPUTER VISION</text><text x="50" y="199" class="text" font-size="11.5" font-weight="700">Perception systems that turn</text><text x="50" y="218" class="muted" font-size="10.5">pixels into spatial understanding.</text><line x1="50" y1="239" x2="266" y2="239" class="lineSoft" stroke-width="1"/><rect x="50" y="254" width="60" height="28" rx="6" class="surface2" stroke="var(--line)" stroke-width=".8"/><text x="80.0" y="272" class="text" font-size="8.5" text-anchor="middle">capture</text><path d="M113 268h7" class="line" stroke-width="1" fill="none"/><rect x="122" y="254" width="60" height="28" rx="6" class="surface2" stroke="var(--line)" stroke-width=".8"/><text x="152.0" y="272" class="text" font-size="8.5" text-anchor="middle">infer</text><path d="M185 268h7" class="line" stroke-width="1" fill="none"/><rect x="194" y="254" width="60" height="28" rx="6" class="surface2" stroke="var(--line)" stroke-width=".8"/><text x="224.0" y="272" class="text" font-size="8.5" text-anchor="middle">reconstruct</text><text x="50" y="320" class="faint" font-size="8.5" letter-spacing="1.1">OPERATING LAYER</text><circle cx="53" cy="342" r="2" class="green"/><text x="62" y="345" class="muted" font-size="9.5">OpenCV</text><circle cx="163" cy="342" r="2" class="green"/><text x="172" y="345" class="muted" font-size="9.5">PyTorch</text><circle cx="53" cy="367" r="2" class="green"/><text x="62" y="370" class="muted" font-size="9.5">TensorFlow</text><circle cx="163" cy="367" r="2" class="green"/><text x="172" y="370" class="muted" font-size="9.5">3D vision</text></g><g class="rise" style="animation-delay:0.32s"><rect x="304" y="140" width="252" height="250" rx="14" class="surface" stroke="var(--line)" stroke-width="1"/><text x="322" y="168" class="cyan" font-size="9.5" letter-spacing="1.4">02 / SPATIAL / XR</text><text x="322" y="199" class="text" font-size="11.5" font-weight="700">Interfaces that connect digital</text><text x="322" y="218" class="muted" font-size="10.5">intelligence to physical space.</text><line x1="322" y1="239" x2="538" y2="239" class="lineSoft" stroke-width="1"/><rect x="322" y="254" width="60" height="28" rx="6" class="surface2" stroke="var(--line)" stroke-width=".8"/><text x="352.0" y="272" class="text" font-size="8.5" text-anchor="middle">map</text><path d="M385 268h7" class="line" stroke-width="1" fill="none"/><rect x="394" y="254" width="60" height="28" rx="6" class="surface2" stroke="var(--line)" stroke-width=".8"/><text x="424.0" y="272" class="text" font-size="8.5" text-anchor="middle">interact</text><path d="M457 268h7" class="line" stroke-width="1" fill="none"/><rect x="466" y="254" width="60" height="28" rx="6" class="surface2" stroke="var(--line)" stroke-width=".8"/><text x="496.0" y="272" class="text" font-size="8.5" text-anchor="middle">simulate</text><text x="322" y="320" class="faint" font-size="8.5" letter-spacing="1.1">OPERATING LAYER</text><circle cx="325" cy="342" r="2" class="cyan"/><text x="334" y="345" class="muted" font-size="9.5">Unity</text><circle cx="435" cy="342" r="2" class="cyan"/><text x="444" y="345" class="muted" font-size="9.5">OpenXR</text><circle cx="325" cy="367" r="2" class="cyan"/><text x="334" y="370" class="muted" font-size="9.5">React Native</text><circle cx="435" cy="367" r="2" class="cyan"/><text x="444" y="370" class="muted" font-size="9.5">ROS</text></g><g class="rise" style="animation-delay:0.44s"><rect x="576" y="140" width="252" height="250" rx="14" class="surface" stroke="var(--line)" stroke-width="1"/><text x="594" y="168" class="violet" font-size="9.5" letter-spacing="1.4">03 / AI SYSTEMS</text><text x="594" y="199" class="text" font-size="11.5" font-weight="700">Agentic products that observe,</text><text x="594" y="218" class="muted" font-size="10.5">reason, and take useful action.</text><line x1="594" y1="239" x2="810" y2="239" class="lineSoft" stroke-width="1"/><rect x="594" y="254" width="60" height="28" rx="6" class="surface2" stroke="var(--line)" stroke-width=".8"/><text x="624.0" y="272" class="text" font-size="8.5" text-anchor="middle">retrieve</text><path d="M657 268h7" class="line" stroke-width="1" fill="none"/><rect x="666" y="254" width="60" height="28" rx="6" class="surface2" stroke="var(--line)" stroke-width=".8"/><text x="696.0" y="272" class="text" font-size="8.5" text-anchor="middle">reason</text><path d="M729 268h7" class="line" stroke-width="1" fill="none"/><rect x="738" y="254" width="60" height="28" rx="6" class="surface2" stroke="var(--line)" stroke-width=".8"/><text x="768.0" y="272" class="text" font-size="8.5" text-anchor="middle">act</text><text x="594" y="320" class="faint" font-size="8.5" letter-spacing="1.1">OPERATING LAYER</text><circle cx="597" cy="342" r="2" class="violet"/><text x="606" y="345" class="muted" font-size="9.5">FastAPI</text><circle cx="707" cy="342" r="2" class="violet"/><text x="716" y="345" class="muted" font-size="9.5">LLMs</text><circle cx="597" cy="367" r="2" class="violet"/><text x="606" y="370" class="muted" font-size="9.5">RAG</text><circle cx="707" cy="367" r="2" class="violet"/><text x="716" y="370" class="muted" font-size="9.5">Docker</text></g><g class="fade" style="animation-delay:0.65s"><text x="32" y="415" class="faint" font-size="8.5" letter-spacing="1.2">DESIGN PRINCIPLE</text><text x="151" y="415" class="muted" font-size="9.5">build the complete loop — sense, reason, render, act</text></g></svg>