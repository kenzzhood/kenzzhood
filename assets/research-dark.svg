g class="rise" style="animation-delay:0.50s"><rect x="644" y="146" width="184" height="94" rx="12" class="surface" stroke="var(--line)" stroke-width="1"/><text x="659" y="170" class="green" font-size="8.5" letter-spacing="1.2">04 · INTERACT</text><text x="659" y="195" class="text" font-size="12" font-weight="700">Spatial Systems</text><text x="659" y="216" class="muted" font-size="8.8">XR · robotics ·…</text></g><g class="fade" style="animation-delay:0.66s"><text x="32" y="262" class="faint" font-size="8.5" letter-spacing="1.2">NORTH STAR</text><text x="122" y="262" class="muted" font-size="9.5">intelligence that is grounded in the physical world</text></g></svg>