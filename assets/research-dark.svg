<svg xmlns="http://www.w3.org/2000/svg" width="860" height="278" viewBox="0 0 860 278" role="img" aria-labelledby="title desc" font-family="'JetBrains Mono', 'SFMono-Regular', ui-monospace, Menlo, Consolas, monospace"><title id="title">Research frontier</title><desc id="desc">A pipeline connecting computer vision, 3D reconstruction, agentic AI, spatial systems, and robotics.</desc><style>:root{--bg:#080b10;--surface:#0d1219;--surface_2:#111821;--line:#263140;--line_soft:#18212c;--text:#f0f4f8;--muted:#8c9aaa;--faint:#596777;--green:#6ee7a2;--cyan:#7dd3fc;--violet:#c4b5fd;--empty:#141b24}.bg{fill:var(--bg)}.surface{fill:var(--surface)}.surface2{fill:var(--surface_2)}.line{stroke:var(--line)}.lineSoft{stroke:var(--line_soft)}.text{fill:var(--text)}.muted{fill:var(--muted)}.faint{fill:var(--faint)}.green{fill:var(--green)}.cyan{fill:var(--cyan)}.violet{fill:var(--violet)}@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}.rise{opacity:0;animation:rise .7s cubic-bezier(.2,.8,.2,1) forwards}.fade{opacity:0;animation:fade .6s ease forwards}.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.2s cubic-bezier(.2,.8,.2,1) forwards}.pulse{animation:pulse 2.4s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.rise,.fade,.draw,.pulse{animation:none!important;opacity:1!important;transform:none!important;stroke-dashoffset:0!important}}</style><rect class="bg" width="860" height="278" rx="18"/><rect x=".5" y=".5" width="859" height="277" rx="18" fill="none" class="line" stroke-width="1"/><line x1="32" y1="0" x2="32" y2="278" class="lineSoft" stroke-width=".6" opacity=".28"/><line x1="80" y1="0" x2="80" y2="278" class="lineSoft" stroke-width=".6" opacity=".28"/><line x1="128" y1="0" x2="128" y2="278" class="lineSoft" stroke-width=".6" opacity=".28"/><line x1="1