<svg xmlns="http://www.w3.org/2000/svg" width="860" height="224" viewBox="0 0 860 224" role="img" aria-labelledby="title desc" font-family="'JetBrains Mono', 'SFMono-Regular', ui-monospace, Menlo, Consolas, monospace"><title id="title">Research path</title><desc id="desc">From perception and 3D reconstruction to multimodal AI and spatial UX.</desc><style>:root{--bg:#ffffff;--surface:#f6f8fa;--surface_2:#eef2f6;--line:#d0d7de;--line_soft:#e6ebf1;--text:#1f2328;--muted:#656d76;--faint:#8c959f;--green:#1a7f37;--cyan:#0969da;--violet:#8250df;--empty:#ebedf7}.bg{fill:var(--bg)}.surface{fill:var(--surface)}.surface2{fill:var(--surface_2)}.line{stroke:var(--line)}.lineSoft{stroke:var(--line_soft)}.text{fill:var(--text)}.muted{fill:var(--muted)}.faint{fill:var(--faint)}.green{fill:var(--green)}.cyan{fill:var(--cyan)}.violet{fill:var(--violet)}@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}.rise{opacity:0;animation:rise .7s cubic-bezier(.2,.8,.2,1) forwards}.fade{opacity:0;animation:fade .6s ease forwards}.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.2s cubic-bezier(.2,.8,.2,1) forwards}.pulse{animation:pulse 2.4s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.rise,.fade,.draw,.pulse{animation:none!important;opacity:1!important;transform:none!important;stroke-dashoffset:0!important}}</style><rect class="bg" width="860" height="224" rx="12"/><rect x=".5" y=".5" width="859" height="223" rx="12" fill="none" class="line" stroke-width="1"/><rect x="32" y="21" width="4" height="15" rx="2" class="cyan"/><text x="45" y="33" class="text" font-size="18" font-weight="700">From pixels to presence</text><text x="32" y="58" class="muted" font-size="11.5">The same loop shows up in retail XR, holography, and product AI.</text><line x1="32" y1="78" x2="828" y2="78" class="line draw" pathLength="1" stroke-width="1" style="animation-delay:.1s"/><g class="rise" style="animation-delay:0.16s"><rect x="32" y="106" width="184" height="86" rx="12" class="surface" stroke="var(--line)" stroke-width="1"/><text x="47" y="130" class="green" font-size="10">See</text><text x="47" y="154" class="text" font-size="13" font-weight="700">Computer Vision</text><text x="47" y="176" class="muted" font-size="10">Perception for retail, travel, and XR</text></g><path d="M219 149h14l-4-4m4 4-4 4" fill="none" class="line draw" pathLength="1" stroke-width="1" style="animation-delay:0.30s"/><g class="rise" style="animation-delay:0.24s"><rect x="236" y="106" width="184" height="86" rx="12" class="surface" stroke="var(--line)" stroke-width="1"/><text x="251" y="130" class="cyan" font-size="10">Rebuild</text><text x="251" y="154" class="text" font-size="13" font-weight="700">3D Assets</text><text x="251" y="176" class="muted" font-size="10">Gaussian splats · photogrammetry</text></g><path d="M423 149h14l-4-4m4 4-4 4" fill="none" class="line draw" pathLength="1" stroke-width="1" style="animation-delay:0.38s"/><g class="rise" style="animation-delay:0.32s"><rect x="440" y="106" width="184" height="86" rx="12" class="surface" stroke="var(--line)" stroke-width="1"/><text x="455" y="130" class="violet" font-size="10">Reason</text><text x="455" y="154" class="text" font-size="13" font-weight="700">Multimodal AI</text><text x="455" y="176" class="muted" font-size="10">LLMs · RAG · voice &amp; gesture</text></g><path d="M627 149h14l-4-4m4 4-4 4" fill="none" class="line draw" pathLength="1" stroke-width="1" style="animation-delay:0.46s"/><g class="rise" style="animation-delay:0.40s"><rect x="644" y="106" width="184" height="86" rx="12" class="surface" stroke="var(--line)" stroke-width="1"/><text x="659" y="130" class="green" font-size="10">Touch</text><text x="659" y="154" class="text" font-size="13" font-weight="700">Spatial UX</text><text x="659" y="176" class="muted" font-size="10">AR · holography · retail interfaces</text></g></svg>