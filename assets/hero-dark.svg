<svg xmlns="http://www.w3.org/2000/svg" width="860" height="380" viewBox="0 0 860 380" role="img" aria-labelledby="title desc" font-family="'JetBrains Mono', 'SFMono-Regular', ui-monospace, Menlo, Consolas, monospace"><title id="title">Goutham Srinath K. — AI / XR Engineer</title><desc id="desc">AI / XR engineer building computer vision, spatial computing, and multimodal AI systems. Founder of InnoXR Labs.</desc><style>:root{--bg:#0d1117;--surface:#151b23;--surface_2:#1c2330;--line:#30363d;--line_soft:#21262d;--text:#e6edf3;--muted:#8b949e;--faint:#6e7681;--green:#3fb950;--cyan:#58a6ff;--violet:#a371f7;--empty:#161b22}.bg{fill:var(--bg)}.surface{fill:var(--surface)}.surface2{fill:var(--surface_2)}.line{stroke:var(--line)}.lineSoft{stroke:var(--line_soft)}.text{fill:var(--text)}.muted{fill:var(--muted)}.faint{fill:var(--faint)}.green{fill:var(--green)}.cyan{fill:var(--cyan)}.violet{fill:var(--violet)}@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}.rise{opacity:0;animation:rise .7s cubic-bezier(.2,.8,.2,1) forwards}.fade{opacity:0;animation:fade .6s ease forwards}.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.2s cubic-bezier(.2,.8,.2,1) forwards}.pulse{animation:pulse 2.4s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.rise,.fade,.draw,.pulse{animation:none!important;opacity:1!important;transform:none!important;stroke-dashoffset:0!important}}</style><rect class="bg" width="860" height="380" rx="12"/><rect x=".5" y=".5" width="859" height="379" rx="12" fill="none" class="line" stroke-width="1"/><g class="fade" style="animation-delay:.05s"><text x="32" y="38" class="green" font-size="10" letter-spacing="1.2">AI / XR ENGINEER</text><text x="524" y="38" class="faint" font-size="10.5" text-anchor="end">Bengaluru, India</text></g><g class="rise" style="animation-delay:0.10s"><text x="32" y="82" class="text" font-size="29" font-weight="700" letter-spacing="-.6">Goutham Srinath K.</text><text x="32" y="110" class="cyan" font-size="12.5">Making Retail Intelligent  ·  Your Vision, Our Technology</text></g><g class="rise" style="animation-delay:0.18s"><text x="32" y="146" class="text" font-size="13.5">Computer vision, XR, and multimodal AI</text><text x="32" y="168" class="text" font-size="13.5">systems—designed, built, and shipped end to end.</text></g><line x1="32" y1="204" x2="524" y2="204" class="line draw" pathLength="1" stroke-width="1" style="animation-delay:.24s"/><g class="rise" style="animation-delay:0.30s"><text x="32" y="236" class="faint" font-size="10">Focus</text><text x="115" y="236" class="text" font-size="12">Computer Vision · XR · Multimodal AI</text></g><g class="rise" style="animation-delay:0.38s"><text x="32" y="264" class="faint" font-size="10">Shipped</text><text x="115" y="264" class="text" font-size="12">AuraFit · AutoOps · MILES · Wander Lens</text></g><g class="rise" style="animation-delay:0.46s"><text x="32" y="292" class="faint" font-size="10">Certified</text><text x="115" y="292" class="text" font-size="12">Unity Certified Associate — Game Developer</text></g><line x1="32" y1="326" x2="524" y2="326" class="lineSoft" stroke-width="1"/><g class="fade" style="animation-delay:0.58s"><text x="32" y="350" class="muted" font-size="11">Founder, InnoXR Labs</text><text x="32" y="370" class="faint" font-size="10.5">Incubated at IITMIC · NSRCEL · iTNT · Sathyabama</text></g><rect x="548" y="32" width="280" height="316" rx="12" class="surface" stroke="var(--line)" stroke-width="1"/><text xml:space="preserve" x="566" y="58.0" class="text fade" font-size="7.4" opacity=".9" textLength="244" lengthAdjust="spacing" style="animation-delay:0.220s">                                            </text><text xml:space="preserve" x="566" y="67.0" class="text fade" font-size="7.4" opacity=".9" textLen