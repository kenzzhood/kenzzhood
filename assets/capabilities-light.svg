<svg xmlns="http://www.w3.org/2000/svg" width="860" height="400" viewBox="0 0 860 400" role="img" aria-labelledby="title desc" font-family="'JetBrains Mono', 'SFMono-Regular', ui-monospace, Menlo, Consolas, monospace"><title id="title">What I build</title><desc id="desc">Vision and 3D, spatial XR, and AI product systems.</desc><style>:root{--bg:#ffffff;--surface:#f6f8fa;--surface_2:#eef2f6;--line:#d0d7de;--line_soft:#e6ebf1;--text:#1f2328;--muted:#656d76;--faint:#8c959f;--green:#1a7f37;--cyan:#0969da;--violet:#8250df;--empty:#ebedf7}.bg{fill:var(--bg)}.surface{fill:var(--surface)}.surface2{fill:var(--surface_2)}.line{stroke:var(--line)}.lineSoft{stroke:var(--line_soft)}.text{fill:var(--text)}.muted{fill:var(--muted)}.faint{fill:var(--faint)}.green{fill:var(--green)}.cyan{fill:var(--cyan)}.violet{fill:var(--violet)}@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}.rise{opacity:0;animation:rise .7s cubic-bezier(.2,.8,.2,1) forwards}.fade{opacity:0;animation:fade .6s ease forwards}.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.2s cubic-bezier(.2,.8,.2,1) forwards}.pulse{animation:pulse 2.4s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.rise,.fade,.draw,.pulse{animation:none!important;opacity:1!important;transform:none!important;stroke-dashoffset:0!important}}</style><rect class="bg" width="860" height="400" rx="16"/><rect x=".5" y=".5" width="859" height="399" rx="16" fill="none" class="line" stroke-width="1"/><text x="32" y="36" class="green" font-size="10">Skills</text><text x="32" y="68" class="text" font-size="22" font-weight="700">What I build with.</text><text x="32" y="92" class="muted" font-size="12">Vision, spatial interfaces, and AI systems shipped as real products.</text><line x1="32" y1="112" x2="828" y2="112" class="line draw" pathLength="1" stroke-width="1" style="animation-delay:.1s"/><g class="rise" style="animation-delay:0.16s"><rect x="32" y="136" width="252" height="232" rx="12" class="surface" stroke="var(--line)" stroke-width="1"/><text x="50" y="164" class="green" font-size="10">01  Vision &amp; 3D</text><text x="50" y="194" class="text" font-size="12" font-weight="700">Turn product media and scenes into</text><text x="50" y="214" class="muted" font-size="11">interactive spatial assets.</text><line x1="50" y1="232" x2="266" y2="232" class="lineSoft" stroke-width="1"/><rect x="50" y="246" width="62" height="28" rx="6" class="surface2" stroke="var(--line)" stroke-width=".8"/><text x="81.0" y="264" class="text" font-size="9" text-anchor="middle">capture</text><path d="M115 260h7" class="line" stroke-width="1" fill="none"/><rect x="122" y="246" width="62" height="28" rx="6" class="surface2" stroke="var(--line)" stroke-width=".8"/><text x="153.0" y="264" class="text" font-size="9" text-anchor="middle">reconstruct</text><path d="M187 260h7" class="line" stroke-width="1" fill="none"/><rect x="194" y="246" width="62" height="28" rx="6" class="surface2" stroke="var(--line)" stroke-width=".8"/><text x="225.0" y="264" class="text" font-size="9" text-anchor="middle">render</text><text x="50" y="306" class="faint" font-size="9">Stack</text><text x="50" y="330" class="muted" font-size="10.5">OpenCV</text><text x="160" y="330" class="muted" font-size="10.5">Gaussian Splats</text><text x="50" y="352" class="muted" font-size="10.5">Blender</text><text x="160" y="352" class="muted" font-size="10.5">Unity</text></g><g class="rise" style="animation-delay:0.26s"><rect x="304" y="136" width="252" height="232" rx="12" class="surface" stroke="var(--line)" stroke-width="1"/><text x="322" y="164" class="cyan" font-size="10">02  Spatial / XR</text><text x="322" y="194" class="text" font-size="12" font-weight="700">Ship AR, VR, and holographic</text><text x="322" y="214" class="muted" font-size="11">experiences people can actually</text><line x1="322" y1="232" x2="538" y2="232" class="lineSoft" stroke-width="1"/><rect x="322" y="246" width="62" height="28" rx="6" class="surface2" stroke="var(--line)" stroke-width=".8"/><text x="353.0" y="264" class="text" font-size="9" text-anchor="middle">sense</text><path d="M387 260h7" class="line" stroke-width="1" fill="none"/><rect x="394" y="246" width="62" height="28" rx="6" class="surface2" stroke="var(--line)" stroke-width=".8"/><text x="425.0" y="264" class="text" font-size="9" text-anchor="middle">interact</text><path d="M459 260h7" class="line" stroke-width="1" fill="none"/><rect x="466" y="246" width="62" height="28" rx="6" class="surface2" stroke="var(--line)" stroke-width=".8"/><text x="497.0" y="264" class="text" font-size="9" text-anchor="middle">deploy</text><text x="322" y="306" class="faint" font-size="9">Stack</text><text x="322" y="330" class="muted" font-size="10.5">Unity</text><text x="432" y="330" class="muted" font-size="10.5">ARCore</text><text x="322" y="352" class="muted" font-size="10.5">MediaPipe</text><text x="432" y="352" class="muted" font-size="10.5">Flutter</text></g><g class="rise" style="animation-delay:0.36s"><rect x="576" y="136" width="252" height="232" rx="12" class="surface" stroke="var(--line)" stroke-width="1"/><text x="594" y="164" class="violet" font-size="10">03  AI Products</text><text x="594" y="194" class="text" font-size="12" font-weight="700">Full-stack systems that reason,</text><text x="594" y="214" class="muted" font-size="11">retrieve, and take useful action.</text><line x1="594" y1="232" x2="810" y2="232" class="lineSoft" stroke-width="1"/><rect x="594" y="246" width="62" height="28" rx="6" class="surface2" stroke="var(--line)" stroke-width=".8"/><text x="625.0" y="264" class="text" font-size="9" text-anchor="middle">ingest</text><path d="M659 260h7" class="line" stroke-width="1" fill="none"/><rect x="666" y="246" width="62" height="28" rx="6" class="surface2" stroke="var(-