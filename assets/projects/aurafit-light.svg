<svg xmlns="http://www.w3.org/2000/svg" width="860" height="230" viewBox="0 0 860 230" role="img" aria-labelledby="title desc" font-family="'JetBrains Mono', 'SFMono-Regular', ui-monospace, Menlo, Consolas, monospace"><title id="title">AuraFit — AI-NATIVE PRODUCT</title><desc id="desc">A full-stack fashion intelligence platform that transforms a photo and personal taste into editorial, shoppable looks. Architecture: vision input to preference model to look generation to discovery.</desc><style>:root{--bg:#f7f9fb;--surface:#ffffff;--surface_2:#eef3f7;--line:#ccd6e0;--line_soft:#e2e8ef;--text:#111820;--muted:#526170;--faint:#7d8996;--green:#18794e;--cyan:#0369a1;--violet:#6d5bd0;--empty:#e7edf2}.bg{fill:var(--bg)}.surface{fill:var(--surface)}.surface2{fill:var(--surface_2)}.line{stroke:var(--line)}.lineSoft{stroke:var(--line_soft)}.text{fill:var(--text)}.muted{fill:var(--muted)}.faint{fill:var(--faint)}.green{fill:var(--green)}.cyan{fill:var(--cyan)}.violet{fill:var(--violet)}@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}.rise{opacity:0;animation:rise .7s cubic-bezier(.2,.8,.2,1) forwards}.fade{opacity:0;animation:fade .6s ease forwards}.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.2s cubic-bezier(.2,.8,.2,1) forwards}.pulse{animation:pulse 2.4s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.rise,.fade,.draw,.pulse{animation:none!important;opacity:1!important;transform:none!important;stroke-dashoffset:0!important}}</style><rect class="bg" width="860" height="230" rx="18"/><rect x=".5" y=".5" width="859" height="229" rx="18" fill="none" class="line" stroke-width="1"/><g class="rise" style="animation-delay:0.08s"><text x="32" y="35" class="green" font-size="9.5" letter-spacing="1.6">SELECTED SYSTEM // 02</text><text x="32" y="72" clas