<svg xmlns="http://www.w3.org/2000/svg" width="860" height="210" viewBox="0 0 860 210" role="img" aria-labelledby="title desc" font-family="'JetBrains Mono', 'SFMono-Regular', ui-monospace, Menlo, Consolas, monospace"><title id="title">AuraFit — AI fashion studio</title><desc id="desc">Full-stack fashion platform that turns one photo and style prefs into six editorial looks with real shoppable links. Flow: photo in → GPT-4o + vision → look board → product crawl.</desc><style>:root{--bg:#ffffff;--surface:#f6f8fa;--surface_2:#eef2f6;--line:#d0d7de;--line_soft:#e6ebf1;--text:#1f2328;--muted:#656d76;--faint:#8c959f;--green:#1a7f37;--cyan:#0969da;--violet:#8250df;--empty:#ebedf7}.bg{fill:var(--bg)}.surface{fill:var(--surface)}.surface2{fill:var(--surface_2)}.line{stroke:var(--line)}.lineSoft{stroke:var(--line_soft)}.text{fill:var(--text)}.muted{fill:var(--muted)}.faint{fill:var(--faint)}.green{fill:var(--green)}.cyan{fill:var(--cyan)}.violet{fill:var(--violet)}@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}.rise{opacity:0;animation:rise .7s cubic-bezier(.2,.8,.2,1) forwards}.fade{opacity:0;animation:fade .6s ease forwards}.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.2s cubic-bezier(.2,.8,.2,1) forwards}.pulse{animation:pulse 2.4s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.rise,.fade,.draw,.pulse{animation:none!important;opacity:1!important;transform:none!important;stroke-dashoffset:0!important}}</style><rect class="bg" width="860" height="210" rx="16"/><rect x=".5" y=".5" width="859" height="209" rx="16" fill="none" class="line" stroke-width="1"/><g class="rise" style="animation-delay:0.08s"><text x="32" y="34" class="faint" font-size="10">Project 01</text><text x="32" y="66" class="text" font-size="22" font-weight="700">AuraFit</text><text x="32" y="88" class="cyan" font-size="11">AI fashion studio</text></g><g class="rise" style="animation-delay:0.14s"><text x="210" y="44" class="text" font-size="12">Full-stack fashion platform that turns one photo and style prefs</text><text x="210" y="64" class="text" font-size="12">into six editorial looks with real shoppable links.</text></g><line x1="32" y1="108" x2="828" y2="108" class="line draw" pathLength="1" stroke-width="1" style="animation-delay:.2s"/><g class="rise" style="animation-delay:0.26s"><rect x="32" y="124" width="130" height="30" rx="7" class="surface2" stroke="var(--line)" stroke-width=".8"/><circle cx="44" cy="139" r="2.4" class="green"/><text x="54" y="143" class="text" font-size="9.5">photo in</text></g><path d="M165 139h8l-3-3m3 3-3 3" fill="none" class="line draw" pathLength="1" stroke-width="1" style="animation-delay:0.30s"/><g class="rise" style="animation-delay:0.32s"><rect x="178" y="124" width="130" height="30" rx="7" class="surface2" stroke="var(--line)" stroke-width=".8"/><circle cx="190" cy="139" r="2.4" class="cyan"/><text x="200" y="143" class="text" font-size="9.5">GPT-4o + vision</text></g><path d="M311 139h8l-3-3m3 3-3 3" fill="none" class="line draw" pathLength="1" stroke-width="1" style="animation-delay:0.36s"/><g class="rise" style="animation-delay:0.38s"><rect x="324" y="124" width="130" height="30" rx="7" class="surface2" stroke="var(--line)" stroke-width=".8"/><circle cx="336" cy="139" r="2.4" class="violet"/><text x="346" y="143" class="text" font-size="9.5">look board</text></g><path d="M457 139h8l-3-3m3 3-3 3" fill="none" class="line draw" pathLength="1" stroke-width="1" style="animation-delay:0.42s"/><g class="rise" style="animation-delay:0.44s"><rect x="470" y="124" width="130" height="30" rx="7" class="surface2" stroke="var(--line)" stroke-width=".8"/><circle cx="482" cy="139" r="2.4" class="green"/><text x="492" y="143" class="text" font-size="9.5">product crawl</text></g><text x="32" y="186" class="faint" font-size="9">Stack</text><rect x="78.0" y="170" width="58.0" height="22" rx="6" class="surface" stroke="var(--line)" stroke-width=".8"/><text x="107.0" y="185" class="muted" font-size="9" text-anchor="middle">Next.js</text><rect x="143.0" y="170" width="46.0" height="22" rx="6" class="surface" stroke="var(--line)" stroke-width=".8"/><text x="166.0" y="185" class="muted" font-size="9" text-anchor="middle">Expo</text><rect x="196.0" y="170" width="88.0" height="22" rx="6" class="surface" stroke="var(--line)" stroke-width=".8"/><text x="240.0" y="185" class="muted" font-size="9" text-anchor="middle">Azure OpenAI</text><rect x="291.0" y="170" width="52.0" height="22" rx="6" class="surface" stroke="var(--line)" stroke-width=".8"/><text x="317.0" y="185" class="muted" font-size="9" text-anchor="middle">Prisma</text><rect x="350.0" y="170" width="64.0" height="22" rx="6" class="surface" stroke="var(--line)" stroke-width=".8"/><text x="382.0" y="185" class="muted" font-size="9" text-anchor="middle">pgvector</text><rect x="421.0" y="170" width="76.0" height="22" rx="6" class="surface" stroke="var(--line)" stroke-width=".8"/><text x="459.0" y="185" class="muted" font-size="9" text-anchor="middle">Playwright</text><g class="fade" style="animation-delay:0.55s"><text x="828" y="186" class="muted" font-size="10" text-anchor="end">Web studio + mobile app + self-hosted discovery…</text></g></svg>