<svg xmlns="http://www.w3.org/2000/svg" width="860" height="210" viewBox="0 0 860 210" role="img" aria-labelledby="title desc" font-family="'JetBrains Mono', 'SFMono-Regular', ui-monospace, Menlo, Consolas, monospace"><title id="title">AutoOps AI — Observability CLI · PyPI</title><desc id="desc">Autonomous CLI that scans a codebase, instruments it, bootstraps Splunk + OpenTelemetry, and runs AI-driven RCA. Flow: scan → instrument → collect evidence → remediate.</desc><style>:root{--bg:#0d1117;--surface:#151b23;--surface_2:#1c2330;--line:#30363d;--line_soft:#21262d;--text:#e6edf3;--muted:#8b949e;--faint:#6e7681;--green:#3fb950;--cyan:#58a6ff;--violet:#a371f7;--empty:#161b22}.bg{fill:var(--bg)}.surface{fill:var(--surface)}.surface2{fill:var(--surface_2)}.line{stroke:var(--line)}.lineSoft{stroke:var(--line_soft)}.text{fill:var(--text)}.muted{fill:var(--muted)}.faint{fill:var(--faint)}.green{fill:var(--green)}.cyan{fill:var(--cyan)}.violet{fill:var(--violet)}@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}.rise{opacity:0;animation:rise .7s cubic-bezier(.2,.8,.2,1) forwards}.fade{opacity:0;animation:fade .6s ease forwards}.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.2s cubic-bezier(.2,.8,.2,1) forwards}.pulse{animation:pulse 2.4s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.rise,.fade,.draw,.pulse{animation:none!important;opacity:1!important;transform:none!important;stroke-dashoffset:0!important}}</style><rect class="bg" width="860" height="210" rx="16"/><rect x=".5" y=".5" width="859" height="209" rx="16" fill="none" class="line" stroke-width="1"/><g class="rise" style="animation-delay:0.08s"><text x="32" y="34" class="faint" font-size="10">Project 02</text><text x="32" y="66" class="text" font-size="22" font-weight="700">AutoOps AI<