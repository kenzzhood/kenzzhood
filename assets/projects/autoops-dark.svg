<svg xmlns="http://www.w3.org/2000/svg" width="406" height="204" viewBox="0 0 406 204" role="img" aria-labelledby="title desc" font-family="'JetBrains Mono', 'SFMono-Regular', ui-monospace, Menlo, Consolas, monospace"><title id="title">AutoOps AI — Open-source CLI · PyPI</title><desc id="desc">Autonomous observability CLI that scans a codebase, instruments it, bootstraps Splunk + OpenTelemetry, and runs AI-driven RCA.</desc><style>:root{--bg:#0d1117;--surface:#151b23;--surface_2:#1c2330;--line:#30363d;--line_soft:#21262d;--text:#e6edf3;--muted:#8b949e;--faint:#6e7681;--green:#3fb950;--cyan:#58a6ff;--violet:#a371f7;--empty:#161b22}.bg{fill:var(--bg)}.surface{fill:var(--surface)}.surface2{fill:var(--surface_2)}.line{stroke:var(--line)}.lineSoft{stroke:var(--line_soft)}.text{fill:var(--text)}.muted{fill:var(--muted)}.faint{fill:var(--faint)}.green{fill:var(--green)}.cyan{fill:var(--cyan)}.violet{fill:var(--violet)}@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}.rise{opacity:0;animation:rise .7s cubic-bezier(.2,.8,.2,1) forwards}.fade{opacity:0;animation:fade .6s ease forwards}.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.2s cubic-bezier(.2,.8,.2,1) forwards}.pulse{animation:pulse 2.4s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.rise,.fade,.draw,.pulse{animation:none!important;opacity:1!important;transform:none!important;stroke-dashoffset:0!important}}</style><rect class="bg" width="406" height="204" rx="12"/><rect x=".5" y=".5" width="405" height="203" rx="12" fill="none" class="line" stroke-width="1"/><g class="rise" style="animation-delay:0.08s"><text x="20" y="28" class="faint" font-size="9.5" letter-spacing="1">PROJECT 03</text><text x="386" y="28" class="green" font-size="9.5" text-anchor="end">↗</text><text x="20" y="54" class="text" font-size="18" font-weight="700">AutoOps AI</text><text x="20" y="74" class="cyan" font-size="10.5">Open-source CLI · PyPI</text></g><line x1="20" y1="90" x2="386" y2="90" class="line draw" pathLength="1" stroke-width="1" style="animation-delay:.16s"/><g class="rise" style="animation-delay:0.20s"><text x="20" y="112" class="muted" font-size="11">Autonomous observability CLI that scans a</text><text x="20" y="130" class="muted" font-size="11">codebase, instruments it, bootstraps Splunk +</text><text x="20" y="148" class="muted" font-size="11">OpenTelemetry, and runs AI-driven RCA.</text></g><g class="fade" style="animation-delay:0.28s"><rect x="20.0" y="170.0" width="54.6" height="21.0" rx="10.5" class="surface2" stroke="var(--line)" stroke-width=".8"/><text x="47.3" y="184.0" class="muted" font-size="9.5" text-anchor="middle">Python</text></g><g class="fade" style="animation-delay:0.33s"><rect x="81.6" y="170.0" width="60.7" height="21.0" rx="10.5" class="surface2" stroke="var(--line)" stroke-width=".8"/><text x="111.9" y="184.0" class="muted" font-size="9.5" text-anchor="middle">FastAPI</text></g><g class="fade" style="animation-delay:0.38s"><rect x="149.3" y="170.0" width="54.6" height="21.0" rx="10.5" class="surface2" stroke="var(--line)" stroke-width=".8"/><text x="176.6" y="184.0" class="muted" font-size="9.5" text-anchor="middle">Splunk</text></g></svg>