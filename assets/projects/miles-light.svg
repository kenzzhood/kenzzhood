<svg xmlns="http://www.w3.org/2000/svg" width="406" height="204" viewBox="0 0 406 204" role="img" aria-labelledby="title desc" font-family="'JetBrains Mono', 'SFMono-Regular', ui-monospace, Menlo, Consolas, monospace"><title id="title">HoloInteract / MILES — IEEE · holographic AI</title><desc id="desc">Interactive holography with MediaPipe hand tracking and RAG-guided multimodal AI for education and product showcases.</desc><style>:root{--bg:#ffffff;--surface:#f6f8fa;--surface_2:#eef2f6;--line:#d0d7de;--line_soft:#e6ebf1;--text:#1f2328;--muted:#656d76;--faint:#8c959f;--green:#1a7f37;--cyan:#0969da;--violet:#8250df;--empty:#ebedf7}.bg{fill:var(--bg)}.surface{fill:var(--surface)}.surface2{fill:var(--surface_2)}.line{stroke:var(--line)}.lineSoft{stroke:var(--line_soft)}.text{fill:var(--text)}.muted{fill:var(--muted)}.faint{fill:var(--faint)}.green{fill:var(--green)}.cyan{fill:var(--cyan)}.violet{fill:var(--violet)}@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}.rise{opacity:0;animation:rise .7s cubic-bezier(.2,.8,.2,1) forwards}.fade{opacity:0;animation:fade .6s ease forwards}.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.2s cubic-bezier(.2,.8,.2,1) forwards}.pulse{animation:pulse 2.4s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.rise,.fade,.draw,.pulse{animation:none!important;opacity:1!important;transform:none!important;stroke-dashoffset:0!important}}</style><rect class="bg" width="406" height="204" rx="12"/><rect x=".5" y=".5" width="405" height="203" rx="12" fill="none" class="line" stroke-width="1"/><g class="rise" style="animation-delay:0.08s"><text x="20" y="28" class="faint" font-size="9.5" letter-spacing="1">PROJECT 01</text><text x="386" y="28" class="green" font-size="9.5" text-anchor="end">↗</text><text x="20" y="54" class="text" font-size="18" font-weight="700">HoloInteract / MILES</text><text x="20" y="74" class="cyan" font-size="10.5">IEEE · holographic AI</text></g><line x1="20" y1="90" x2="386" y2="90" class="line draw" pathLength="1" stroke-width="1" style="animation-delay:.16s"/><g class="rise" style="animation-delay:0.20s"><text x="20" y="112" class="muted" font-size="11">Interactive holography with MediaPipe hand</text><text x="20" y="130" class="muted" font-size="11">tracking and RAG-guided multimodal AI for</text><text x="20" y="148" class="muted" font-size="11">education and product showcases.</text></g><g class="fade" style="animation-delay:0.28s"><rect x="20.0" y="170.0" width="48.5" height="21.0" rx="10.5" class="surface2" stroke="var(--line)" stroke-width=".8"/><text x="44.2" y="184.0" class="muted" font-size="9.5" text-anchor="middle">Unity</text></g><g class="fade" style="animation-delay:0.33s"><rect x="75.5" y="170.0" width="72.9" height="21.0" rx="10.5" class="surface2" stroke="var(--line)" stroke-width=".8"/><text x="112.0" y="184.0" class="muted" font-size="9.5" text-anchor="middle">MediaPipe</text></g><g class="fade" style="animation-delay:0.38s"><rect x="155.4" y="170.0" width="60.7" height="21.0" rx="10.5" class="surface2" stroke="var(--line)" stroke-width=".8"/><text x="185.8" y="184.0" class="muted" font-size="9.5" text-anchor="middle">FastAPI</text></g></svg>