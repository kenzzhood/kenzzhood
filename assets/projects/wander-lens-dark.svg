<svg xmlns="http://www.w3.org/2000/svg" width="860" height="210" viewBox="0 0 860 210" role="img" aria-labelledby="title desc" font-family="'JetBrains Mono', 'SFMono-Regular', ui-monospace, Menlo, Consolas, monospace"><title id="title">Wander Lens — AI travel · AR</title><desc id="desc">Social travel companion with RAG itineraries, matchmaking, and AR memories plus Gaussian Splatting food previews. Flow: plan → match → AR explore → 3D preview.</desc><style>:root{--bg:#0d1117;--surface:#151b23;--surface_2:#1c2330;--line:#30363d;--line_soft:#21262d;--text:#e6edf3;--muted:#8b949e;--faint:#6e7681;--green:#3fb950;--cyan:#58a6ff;--violet:#a371f7;--empty:#161b22}.bg{fill:var(--bg)}.surface{fill:var(--surface)}.surface2{fill:var(--surface_2)}.line{stroke:var(--line)}.lineSoft{stroke:var(--line_soft)}.text{fill:var(--text)}.muted{fill:var(--muted)}.faint{fill:var(--faint)}.green{fill:var(--green)}.cyan{fill:var(--cyan)}.violet{fill:var(--violet)}@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}.rise{opacity:0;animation:rise .7s cubic-bezier(.2,.8,.2,1) forwards}.fade{opacity:0;animation:fade .6s ease forwards}.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.2s cubic-bezier(.2,.8,.2,1) forwards}.pulse{animation:pulse 2.4s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.rise,.fade,.draw,.pulse{animation:none!important;opacity:1!important;transform:none!important;stroke-dashoffset:0!important}}</style><rect class="bg" width="860" height="210" rx="16"/><rect x=".5" y=".5" width="859" height="209" rx="16" fill="none" class="line" stroke-width="1"/><g class="rise" style="animation-delay:0.08s"><text x="32" y="34" class="faint" font-size="10">Project 04</text><text x="32" y="66" class="text" font-size="22" font-weight="700">Wander Lens</text><text x="32" y="88" class="cyan" font-size="11">AI travel · AR</text></g><g class="rise" style="animation-delay:0.14s"><text x="210" y="44" class="text" font-size="12">Social travel companion with RAG itineraries, matchmaking, and AR</text><text x="210" y="64" class="text" font-size="12">memories plus Gaussian Splatting food previews.</text></g><line x1="32" y1="108" x2="828" y2="108" class="line draw" pathLength="1" stroke-width="1" style="animation-delay:.2s"/><g class="rise" style="animation-delay:0.26s"><rect x="32" y="124" width="130" height="30" rx="7" class="surface2" stroke="var(--line)" stroke-width=".8"/><circle cx="44" cy="139" r="2.4" class="green"/><text x="54" y="143" class="text" font-size="9.5">plan</text></g><path d="M165 139h8l-3-3m3 3-3 3" fill="none" class="line draw" pathLength="1" stroke-width="1" style="animation-delay:0.30s"/><g class="rise" style="animation-delay:0.32s"><rect x="178" y="124" width="130" height="30" rx="7" class="surface2" stroke="var(--line)" stroke-width=".8"/><circle cx="190" cy="139" r="2.4" class="cyan"/><text x="200" y="143" class="text" font-size="9.5">match</text></g><path d="M311 139h8l-3-3m3 3-3 3" fill="none" class="line draw" pathLength="1" stroke-width="1" style="animation-delay:0.36s"/><g class="rise" style="animation-delay:0.38s"><rect x="324" y="124" width="130" height="30" rx="7" class="surface2" stroke="var(--line)" stroke-width=".8"/><circle cx="336" cy="139" r="2.4" class="violet"/><text x="346" y="143" class="text" font-size="9.5">AR explore</text></g><path d="M457 139h8l-3-3m3 3-3 3" fill="none" class="line draw" pathLength="1" stroke-width="1" style="animation-delay:0.42s"/><g class="rise" style="animation-delay:0.44s"><rect x="470" y="124" width="130" height="30" rx="7" class="surface2" stroke="var(--line)" stroke-width=".8"/><circle cx="482" cy="139" r="2.4" class="green"/><text x="492" y="143" class="text" font-size="9.5">3D preview</text></g><text x="32" y="186" class="faint" font-size="9">Stack</text><rect x=